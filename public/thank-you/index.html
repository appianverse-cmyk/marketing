<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#090d1a" />
    <title>Thank You | Nexora</title>
    <meta
      name="description"
      content="Thank you for submitting your details to Nexora."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M9 23V9h3.2l7.6 9.2V9H23v14h-3.1l-7.7-9.3V23H9Z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #090d1a;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 16%, rgba(99, 102, 241, 0.23), transparent 30rem),
          radial-gradient(circle at 86% 84%, rgba(236, 72, 153, 0.17), transparent 28rem),
          #090d1a;
      }

      body::before {
        position: fixed;
        inset: 0;
        pointer-events: none;
        content: "";
        opacity: 0.25;
        background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: linear-gradient(to bottom, black, transparent 80%);
      }

      main {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 20px;
      }

      .confirmation {
        width: min(100%, 660px);
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 14px;
        background: linear-gradient(135deg, #4f46e5, #9333ea 55%, #ec4899);
        box-shadow: 0 14px 40px rgba(99, 102, 241, 0.3);
        color: #fff;
        font-size: 21px;
        font-weight: 800;
      }

      .brand-name {
        color: #fff;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .card {
        position: relative;
        overflow: hidden;
        padding: clamp(34px, 7vw, 62px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        background: linear-gradient(145deg, rgba(22, 30, 55, 0.9), rgba(12, 17, 34, 0.92));
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.38);
        backdrop-filter: blur(20px);
      }

      .card::before {
        position: absolute;
        top: 0;
        left: 12%;
        width: 76%;
        height: 1px;
        content: "";
        background: linear-gradient(90deg, transparent, #a78bfa, #f472b6, transparent);
      }

      .success-icon {
        display: grid;
        width: 78px;
        height: 78px;
        margin: 0 auto 28px;
        place-items: center;
        border: 1px solid rgba(52, 211, 153, 0.28);
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.12);
        box-shadow: 0 0 0 11px rgba(16, 185, 129, 0.04),
          0 18px 50px rgba(16, 185, 129, 0.14);
      }

      .success-icon svg {
        width: 36px;
        height: 36px;
        stroke: #6ee7b7;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #c4b5fd;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #fff;
        font-size: clamp(36px, 7vw, 58px);
        line-height: 1.04;
        letter-spacing: -0.055em;
      }

      .message {
        max-width: 490px;
        margin: 22px auto 0;
        color: #cbd5e1;
        font-size: clamp(16px, 2.5vw, 18px);
        line-height: 1.75;
      }

      .next-step {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 34px;
        padding: 17px 18px;
        border: 1px solid rgba(129, 140, 248, 0.18);
        border-radius: 16px;
        background: rgba(99, 102, 241, 0.08);
        text-align: left;
      }

      .next-step-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #a5b4fc;
        box-shadow: 0 0 18px rgba(165, 180, 252, 0.7);
      }

      .next-step p {
        margin: 0;
        color: #dbeafe;
        font-size: 14px;
        line-height: 1.6;
      }

      .close-note {
        margin: 24px 0 0;
        color: #64748b;
        font-size: 13px;
      }

      @media (max-width: 520px) {
        main {
          padding: 24px 16px;
        }

        .brand {
          margin-bottom: 24px;
        }

        .card {
          border-radius: 24px;
        }

        .success-icon {
          width: 68px;
          height: 68px;
          margin-bottom: 24px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .card {
          animation: arrive 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .success-icon {
          animation: settle 700ms 180ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(16px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        @keyframes settle {
          from {
            opacity: 0;
            transform: scale(0.72) rotate(-8deg);
          }
          to {
            opacity: 1;
            transform: scale(1) rotate(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="confirmation" aria-labelledby="thank-you-title">
        <div class="brand" aria-label="Nexora">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span class="brand-name">Nexora</span>
        </div>

        <div class="card">
          <div class="success-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 4 4L19 6" />
            </svg>
          </div>

          <p class="eyebrow">Submission received</p>
          <h1 id="thank-you-title">Thank you!</h1>
          <p class="message">
            Your details have been submitted successfully. Our team will review your response and get in touch if there is a suitable opportunity.
          </p>

          <div class="next-step">
            <span class="next-step-dot" aria-hidden="true"></span>
            <p>Please keep an eye on your email for any updates from the Nexora team.</p>
          </div>

          <p class="close-note">You may safely close this tab.</p>
        </div>
      </section>
    </main>
  </body>
</html>
